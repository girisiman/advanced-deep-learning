name: adl-cpu
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - cpuonly
  - numpy
  - matplotlib
  - pandas
  - scikit-learn
  - jupyter
  - pip
  - pip:
      - tqdm

# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
# Activate: conda activate adl-cpu
